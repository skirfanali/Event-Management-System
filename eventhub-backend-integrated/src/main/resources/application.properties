# ==================================================
# Server
# ==================================================
server.port=${PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always

# ==================================================
# Application
# ==================================================
spring.application.name=eventhub-backend
app.name=EventHub

# ==================================================
# MySQL / Aiven
# ==================================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================================================
# JPA / Hibernate
# ==================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ==================================================
# JWT
# ==================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ==================================================
# File Upload
# ==================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==================================================
# Cloudinary
# ==================================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ==================================================
# Mail
# \u2705 FIX: Added fallback defaults so the app starts even without env vars
#    and logs a clear warning instead of silently failing
# ==================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${MAIL_FROM:}

# ==================================================
# Frontend CORS
# ==================================================
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# ==================================================
# Razorpay
# ==================================================
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# ==================================================
# Swagger
# ==================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ==================================================
# Logging
# ==================================================

logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
# \u2705 Show mail errors clearly instead of hiding them
logging.level.org.springframework.mail=DEBUG